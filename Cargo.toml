[package]
name = "triangular_arbitrage_bot"
version = "0.1.2"
edition = "2024"

[dependencies]
dotenv = "0.15.0"
tokio = { version = "1", features = ["full", "test-util"] }
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
tokio-util = { version = "0.7", features = ["full"] }
futures-util = "0.3.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.18"
url = "2.2"
log = "0.4"
env_logger = "0.10"
csv = "1.3"
chrono = "0.4"
async-trait = "0.1.89"
regex = "1.12.2"

[net]
offline = true

[source.crates-io]
replace-with = "vendored-sources"

[source.vendored-sources]
directory = "vendor"
